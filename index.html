<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logoonly.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta -->

    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://oncuemarketing.co.za/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://oncuemarketing.co.za/" />
    <meta property="og:title" content="OnCue Marketing | Experiential & Promotional Marketing Agency" />
    <meta property="og:description" content="Turning your brand goals into shared wins. Experiential marketing, brand activations, and promotional staffing across South Africa." />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="OnCue Marketing" />
    <meta property="og:locale" content="en_ZA" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OnCue Marketing | Experiential & Promotional Marketing Agency" />
    <meta name="twitter:description" content="Turning your brand goals into shared wins. Brand activations, product launches and promotional staffing across South Africa." />
    <meta name="twitter:image" content="https://oncuemarketing.co.za/images/background2.png" />

    <!-- Geo -->
    <meta name="geo.region" content="ZA-GT" />
    <meta name="geo.placename" content="Johannesburg, South Africa" />

    <!-- Theme color (mobile browser chrome) -->
    <meta name="theme-color" content="#000000" />

    <!-- Preconnect for faster font + blob loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://sjqncrtrprldnmfg.public.blob.vercel-storage.com" crossorigin />

    <!-- Preload hero image so LCP fires immediately -->
    <link rel="preload" as="image" href="/images/Oncue%20homepage%20background.png" />

    <!-- Google Fonts — loaded async so they don't block rendering -->
    <link rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'"
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Cinzel:wght@700;900&family=Playfair+Display:ital,wght@0,700;1,400&family=Bebas+Neue&family=Montserrat:wght@400;700;900&family=Raleway:wght@300;700&family=Nunito:wght@400;700&family=Libre+Baskerville:ital,wght@0,700;1,400&display=swap" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Cinzel:wght@700;900&family=Playfair+Display:ital,wght@0,700;1,400&family=Bebas+Neue&family=Montserrat:wght@400;700;900&family=Raleway:wght@300;700&family=Nunito:wght@400;700&family=Libre+Baskerville:ital,wght@0,700;1,400&display=swap" />
    </noscript>

        {
          "@type": "MarketingAgency",

          "name": "OnCue Marketing",
          "url": "https://oncuemarketing.co.za/",
          "logo": "https://oncuemarketing.co.za/logoonly.png",
          "image": "https://oncuemarketing.co.za/images/background2.png",
          "description": "OnCue Marketing is a dynamic experiential and promotional marketing agency delivering impactful brand activations, product launches, and professional promotional staffing across South Africa.",
          "telephone": "+27601064358",
          "email": "admin@oncuemarketing.info",
          "sameAs": ["https://instagram.com/oncuemarketing"],
          "areaServed": [
            { "@type": "City", "name": "Johannesburg" },
            { "@type": "City", "name": "Cape Town" },
            { "@type": "City", "name": "Durban" }
          ],
          "address": {
            "@type": "PostalAddress",
            "addressCountry": "ZA",
            "addressRegion": "Gauteng"
          },
          "serviceType": [
            "Experiential Marketing",
            "Brand Activations",
            "Promotional Staffing",
            "Brand Ambassadors",
            "Product Launches",
            "Corporate Events",
            "In-Store Activations"
          ],
          "priceRange": "$$"
        },
        {
          "@type": "WebSite",
          "@id": "https://oncuemarketing.co.za/#website",
          "url": "https://oncuemarketing.co.za/",
          "name": "OnCue Marketing",
          "publisher": { "@id": "https://oncuemarketing.co.za/#organization" }
        }
      ]
    }
    </script>
  </head>
